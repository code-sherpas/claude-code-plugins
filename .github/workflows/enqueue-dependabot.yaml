name: enqueue-dependabot

# Moves the agent-skills submodule to the latest commit of
# code-sherpas/agent-skills with nobody reviewing it: this puts Dependabot's
# pull request in the merge queue, where `quality_checks` builds the tree that
# will land and the skills test in it stands in for the reviewer.
#
# It enqueues THAT pull request and nothing else. Being opened by Dependabot is
# not enough: another ecosystem added to dependabot.yml, or a security update
# switched on in the repository's settings, would also open pull requests as
# dependabot[bot] — and those may change workflows or code. So it enqueues only
# a pull request that changes exactly one file, plugins/base/agent-skills, and
# only its submodule pointer. Anything else stays open for a person.
#
# It enqueues as the agent-plugins-updater GitHub App, not with the
# workflow's GITHUB_TOKEN: GitHub runs no workflow for an event the
# GITHUB_TOKEN caused, and the merge queue's build is a workflow. Measured
# 2026-10-29 (#6): enqueued with the GITHUB_TOKEN, the entry sat in
# AWAITING_CHECKS and no build started. The App's ID and private key are
# *Dependabot* secrets, because a run Dependabot triggered sees no others.

on:
  pull_request:
    branches: ["main"]

# The workflow's own token only reads; the App's token is the one that writes.
permissions:
  contents: read
  pull-requests: read

jobs:
  enqueue:
    if: >-
      ${{ github.event.pull_request.user.login == 'dependabot[bot]'
          && startsWith(github.event.pull_request.head.ref, 'dependabot/submodules/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Only the agent-skills submodule pointer changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          echo "Changed files:"; echo "$files"
          [ "$files" = "plugins/base/agent-skills" ] || { echo "::notice::Not only the agent-skills submodule: left for a person."; exit 1; }
          mode="$(gh api "repos/$REPO/contents/plugins/base/agent-skills?ref=$HEAD" --jq '.type')"
          [ "$mode" = "submodule" ] || { echo "::notice::plugins/base/agent-skills is not a submodule at $HEAD: left for a person."; exit 1; }
      - name: Get a token of the agent-plugins-updater App
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_PLUGINS_UPDATER_APP_ID }}
          private-key: ${{ secrets.AGENT_PLUGINS_UPDATER_PRIVATE_KEY }}
      - name: Put the pull request in the merge queue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto "$PR_URL"
